# Compile l'APK IW4LJ (Android, arm64) sur les serveurs GitHub.
# Port Linux du script IW4LJ-Android/crates/android/package.ps1.
# Non testé : au premier échec, envoyer le log de l'étape en rouge.
#
# À placer dans le fork : .github/workflows/android.yml
# Lancer : onglet Actions -> "Build Android APK" -> Run workflow.
# Résultat : section "Artifacts" en bas de la page du run (IW4LJ-fresh-build.zip).

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de la place disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "IW4LJ-Android -> target"

      - name: Paquets système
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config zip

      - name: SDK et NDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Compiler la bibliothèque Rust
        working-directory: IW4LJ-Android
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android31-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android31-clang++"
          # perfetto-sdk-sys cherche un `clang++` du système si la variable CXX est absente,
          # ce qui compile sans les en-têtes Android. On la définit pour le forcer sur le NDK,
          # et on garde g++ pour les outils qui tournent sur la machine de build.
          export CXX="$BIN/aarch64-linux-android31-clang++"
          export CXX_x86_64_unknown_linux_gnu=g++
          export HOST_CXX=g++
          export RUST_BACKTRACE=1
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android31-clang"
          cargo build -p iw4l-android --profile play --target aarch64-linux-android

      # Steam (shared Legacy Mobile screen, same steps as Legacy 4): JavaSteam and what it uses.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Bibliothèques Steam (JavaSteam, téléchargement depuis le compte du joueur)
        run: |
          set -euo pipefail
          S="IW4LJ-Android/crates/android/steam"
          gradle -p "$S" collectDeps collectAar --no-daemon -q
          ls "$S/build/deps"
          python3 "$S/prepare_jars.py" "$S/build/deps" "$S/build/aar" build/steamjars build/steamres

      - name: Clé de signature (réutilisée d'un build à l'autre)
        uses: actions/cache@v4
        with:
          path: ks
          key: iw4l-keystore-v1

      - name: Assembler et signer l'APK
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          C="IW4LJ-Android/crates/android"
          SO="IW4LJ-Android/target/aarch64-linux-android/play/libiw4l_android.so"
          B="$PWD/build"
          mkdir -p "$B/classes" "$B/dex" "$B/stage/lib/arm64-v8a" ks

          # The game's screens plus the shared Steam screen (dev/zyproz/legacy/steam), against the Steam jars.
          CP="$JAR:$(ls "$B"/steamjars/*.jar | tr '\n' ':')"
          javac -source 17 -target 17 -classpath "$CP" -d "$B/classes" \
            $(find "$C/android/java" -name '*.java')
          jar cf "$B/classes.jar" -C "$B/classes" .
          # Many libraries: d8 writes several classes*.dex files (multidex, Android 5+).
          # Its full report goes into the artifact (d8.log): a failure shows only one line on GitHub.
          export _JAVA_OPTIONS="-Xmx6g"
          if ! "$BT/d8" --release --lib "$JAR" --min-api 31 --output "$B/dex" "$B/classes.jar" "$B"/steamjars/*.jar \
              > "$B/d8.log" 2>&1; then
            cat "$B/d8.log"
            exit 1
          fi
          unset _JAVA_OPTIONS
          ls -l "$B/dex"

          "$BT/aapt2" compile --dir "$C/res" -o "$B/res.zip"
          "$BT/aapt2" link -o "$B/base.apk" -I "$JAR" \
            --manifest "$C/android/AndroidManifest.xml" \
            --min-sdk-version 31 --target-sdk-version 34 "$B/res.zip"

          "$BIN/llvm-strip" --strip-all -o "$B/stage/lib/arm64-v8a/libiw4l_android.so" "$SO"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            "$B/stage/lib/arm64-v8a/"
          cp "$B"/dex/classes*.dex "$B/stage/"
          # Zstandard for Steam chunks, built for Android (from the zstd-jni .aar).
          cp IW4LJ-Android/crates/android/steam/build/aar/jni/arm64-v8a/*.so "$B/stage/lib/arm64-v8a/"

          # Bibliothèques stockées sans compression, comme dans package.ps1.
          (cd "$B/stage" && zip -0 -r ../base.apk classes*.dex lib)
          # Files the Steam libraries read at run time.
          (cd "$B/steamres" && zip -r -q ../base.apk .)
          "$BT/zipalign" -p -f 4 "$B/base.apk" "$B/aligned.apk"

          if [ ! -f ks/iw4l.keystore ]; then
            keytool -genkeypair -keystore ks/iw4l.keystore -alias iw4l \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass iw4l-ci-pass -keypass iw4l-ci-pass -dname "CN=IW4LJ CI"
          fi
          # The version is part of the file name, so everyone knows what they install.
          VER=$(grep -o 'android:versionName="[^"]*"' "$C/android/AndroidManifest.xml" | head -1 | cut -d'"' -f2)
          [ -n "$VER" ] || VER=unknown
          OUT="$B/Legacy-Warfare-$VER.apk"
          "$BT/apksigner" sign --ks ks/iw4l.keystore --ks-pass pass:iw4l-ci-pass \
            --ks-key-alias iw4l --key-pass pass:iw4l-ci-pass \
            --out "$OUT" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IW4LJ-fresh-build
          path: |
            build/Legacy-Warfare-*.apk
            build/d8.log
          if-no-files-found: warn
